name: Clean install and test on Windows, macOS, Linux

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # ---------- OCR program + language packs (as in the Installation Guide)
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $td = "C:\Program Files\Tesseract-OCR\tessdata"
          foreach ($l in "fra","deu","nld","spa","ita","por") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata" -OutFile "$td\$l.traineddata"
          }
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-deu tesseract-ocr-nld tesseract-ocr-spa tesseract-ocr-ita tesseract-ocr-por xvfb

      # ---------- clean install exactly as the client would (fresh venv, requirements.txt only)
      - name: Clean install from requirements.txt
        shell: bash
        run: |
          python -m venv cleanvenv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=cleanvenv/Scripts/python; else PY=cleanvenv/bin/python; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install -r app/requirements.txt
          $PY -m pip install pytest
          $PY -m pip freeze > installed-versions-${{ matrix.os }}-py${{ matrix.python }}.txt
          echo "PY=$PY" >> $GITHUB_ENV

      - name: Automated tests
        shell: bash
        working-directory: app
        run: ../${{ env.PY }} -m pytest -q -p no:cacheprovider --junitxml=../junit-${{ matrix.os }}-py${{ matrix.python }}.xml

      - name: Real window test (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: ${{ env.PY }} ci/run_gui_check.py
      - name: Real window test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x900x24" ${{ env.PY }} ci/run_gui_check.py

      # ---------- the double-click launcher, on a fresh copy with no .venv (first-run install path)
      - name: Windows launcher (.bat) first-run install and start
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse app "$env:RUNNER_TEMP\Invoice Processor"
          Set-Location "$env:RUNNER_TEMP\Invoice Processor"
          Remove-Item -Recurse -Force tests -ErrorAction SilentlyContinue
          cmd /c "`"Start Invoice Processor.bat`"" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\launcher-log.txt"
          if (-not (Test-Path ".venv\Scripts\pythonw.exe")) { throw "launcher did not create the environment" }
          Start-Sleep -Seconds 15
          $p = Get-Process pythonw -ErrorAction SilentlyContinue
          if (-not $p) { throw "the app window process is not running" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\ci-output" | Out-Null
          $bmp.Save("$env:GITHUB_WORKSPACE\ci-output\3_launched_by_bat.png")
          "pythonw running: PID $($p.Id)" | Tee-Object -Append -FilePath "$env:GITHUB_WORKSPACE\launcher-log.txt"
          Stop-Process -Id $p.Id
          # second start must be instant (no reinstall)
          $t = Measure-Command { cmd /c "`"Start Invoice Processor.bat`"" }
          "second start took $($t.TotalSeconds) s" | Tee-Object -Append -FilePath "$env:GITHUB_WORKSPACE\launcher-log.txt"
          Start-Sleep -Seconds 5; Get-Process pythonw | Stop-Process

      - name: Command-line entry point
        shell: bash
        run: |
          mkdir -p cli-test/inbox && cp app/tests/data/sample_invoices/northgate_INV-10422.pdf cli-test/inbox/
          ${{ env.PY }} app/process_invoices_cli.py --inbox cli-test/inbox --output cli-test/out || test $? -eq 1
          ls cli-test/out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ci-output/*.png
            ci-output/*.json
            junit-*.xml
            installed-versions-*.txt
            launcher-log.txt
