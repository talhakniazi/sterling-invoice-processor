name: Clean install and test on Windows, macOS, Linux

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # ---------- OCR program + language packs (as in the Installation Guide)
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $td = "C:\Program Files\Tesseract-OCR\tessdata"
          foreach ($l in "fra","deu","nld","spa","ita","por") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata" -OutFile "$td\$l.traineddata"
          }
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-deu tesseract-ocr-nld tesseract-ocr-spa tesseract-ocr-ita tesseract-ocr-por xvfb

      # ---------- clean install exactly as the client would (fresh venv, requirements.txt only)
      - name: Clean install from requirements.txt
        shell: bash
        run: |
          python -m venv cleanvenv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=cleanvenv/Scripts/python; else PY=cleanvenv/bin/python; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install -r app/requirements.txt
          $PY -m pip install pytest
          $PY -m pip freeze > installed-versions-${{ matrix.os }}-py${{ matrix.python }}.txt
          echo "PY=$PY" >> $GITHUB_ENV

      - name: Automated tests
        shell: bash
        working-directory: app
        run: ../${{ env.PY }} -m pytest -q -p no:cacheprovider --junitxml=../junit-${{ matrix.os }}-py${{ matrix.python }}.xml

      - name: Real window test (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: ${{ env.PY }} ci/run_gui_check.py
      - name: Real window test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x900x24" ${{ env.PY }} ci/run_gui_check.py

      # ---------- the double-click launcher, on a fresh copy with no .venv (first-run install path)
      - name: Windows launcher (.bat) first-run install and start
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $log = "$env:GITHUB_WORKSPACE\launcher-log.txt"
          function L($m) { $m | Tee-Object -Append -FilePath $log }
          Copy-Item -Recurse app "$env:RUNNER_TEMP\Invoice Processor"
          $dir = "$env:RUNNER_TEMP\Invoice Processor"
          Remove-Item -Recurse -Force "$dir\tests" -ErrorAction SilentlyContinue
          L "line endings: $(if ((Get-Content -Raw "$dir\Start Invoice Processor.bat") -match "`r`n") {'CRLF'} else {'LF only'})"
          # Run the .bat exactly as a double-click would (no pipes), wait only for cmd.exe itself
          $p = Start-Process cmd.exe -ArgumentList '/c', '"Start Invoice Processor.bat"' -WorkingDirectory $dir -PassThru `
               -RedirectStandardOutput "$env:RUNNER_TEMP\bat-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\bat-err.txt"
          if (-not $p.WaitForExit(600000)) {
            Get-Content "$env:RUNNER_TEMP\bat-out.txt","$env:RUNNER_TEMP\bat-err.txt" -ErrorAction SilentlyContinue | ForEach-Object { L $_ }
            Stop-Process -Id $p.Id -Force; throw "launcher did not finish within 10 minutes (stuck at a prompt?) - see launcher-log.txt" }
          Get-Content "$env:RUNNER_TEMP\bat-out.txt","$env:RUNNER_TEMP\bat-err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 15 | ForEach-Object { L $_ }
          L "first run: cmd exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "launcher exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\.venv\Scripts\pythonw.exe")) { throw "launcher did not create the environment" }
          Start-Sleep -Seconds 20
          $w = Get-Process pythonw -ErrorAction SilentlyContinue
          if (-not $w) { throw "the app window process is not running" }
          L "app running: pythonw PID $($w.Id -join ',')"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\ci-output" | Out-Null
          $bmp.Save("$env:GITHUB_WORKSPACE\ci-output\3_launched_by_bat.png")
          $w | Stop-Process -Force
          # Second start must not reinstall (wait for cmd.exe only - NOT its child, the app window)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $q = Start-Process cmd.exe -ArgumentList '/c', '"Start Invoice Processor.bat"' -WorkingDirectory $dir -PassThru
          if (-not $q.WaitForExit(120000)) { throw "second start did not return" }
          L "second start: launcher returned in $([math]::Round($sw.Elapsed.TotalSeconds,1)) s, exit $($q.ExitCode)"
          Start-Sleep -Seconds 10
          $w2 = Get-Process pythonw -ErrorAction SilentlyContinue
          L "second start: app running = $([bool]$w2)"
          $w2 | Stop-Process -Force

      - name: Command-line entry point
        shell: bash
        run: |
          mkdir -p cli-test/inbox && cp app/tests/data/sample_invoices/northgate_INV-10422.pdf cli-test/inbox/
          ${{ env.PY }} app/process_invoices_cli.py --inbox cli-test/inbox --output cli-test/out || test $? -eq 1
          ls cli-test/out

      - name: Save evidence to branch
        if: always()
        shell: bash
        run: |
          B="evidence/${{ matrix.os }}-py${{ matrix.python }}"
          mkdir -p /tmp/ev && cp -r ci-output/*.png ci-output/*.json junit-*.xml installed-versions-*.txt launcher-log.txt /tmp/ev/ 2>/dev/null || true
          echo "${{ job.status }}" > /tmp/ev/job-status.txt
          git config user.email "ci@users.noreply.github.com"; git config user.name "CI"
          git checkout --orphan "$B" -q && git rm -rfq . >/dev/null && git clean -fdxq -e cleanvenv
          cp -r /tmp/ev/. . && git add -A -- . ':!cleanvenv' && git commit -qm "evidence ${{ github.sha }}" && git push -f -q origin "$B"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ci-output/*.png
            ci-output/*.json
            junit-*.xml
            installed-versions-*.txt
            launcher-log.txt
